version: 1
study_id: xauusd_named_session_tpo_regime_robustness_v1
status: frozen
study_type: descriptive
owner: project
frozen_at_utc: "2026-09-04T07:21:00Z"

research_question: >-
  As a declared post-temporal follow-up, does the previously observed New-York-greater-than-London
  descriptive ordering in session range and TPO occupancy-event count persist after conditioning
  current paired session dates on a causal lagged realized-range regime that uses only prior paired
  London/New-York dates?

data:
  market: XAUUSD
  symbol: XAUUSD_o
  dataset_id: xauusd_o_utc_20260904_052959
  dataset_manifest: data/manifests/XAUUSD_o_UTC_20260904_052959.json
  timeframe: M5
  input_timebase: verified_utc
  cutoff_utc: "2026-09-04T05:29:59.763793Z"
  closed_bars_only: true

session_context:
  policy_id: xauusd_major_fx_sessions_v1
  policy_path: config/session-policies/xauusd-major-sessions.yaml
  sessions:
    - london
    - new_york
  selection:
    completeness_mode: complete_only
    exclude_coverage_edges: true

operational_input:
  rule_id: amt_tpo_profile_core_v1
  rule_path: quant/operational/AMT_TPO_PROFILE_CORE.yaml
  price_increment: "0.01"

features:
  - range_ticks
  - occupied_bins
  - occupancy_events
  - mean_bin_occupancy
  - bars_seen

feature_definitions:
  range_ticks: observed_session_high_tick - observed_session_low_tick
  occupied_bins: count of TPO bins with occupancy greater than zero
  occupancy_events: sum of all TPO bin occupancy counts
  mean_bin_occupancy: occupancy_events / occupied_bins
  bars_seen: number of closed bars admitted to the session profile

summary_statistics:
  - n
  - min
  - q25
  - median
  - q75
  - max
  - mean

sample_policy:
  primary_sessions:
    - london
    - new_york
  secondary_descriptive_sessions: []
  minimum_primary_n: 30
  underpowered_action: descriptive_only

comparison_policy:
  pairwise_primary_only: true
  primary_pair:
    - london
    - new_york
  pairwise_outputs:
    - median_difference
    - median_ratio
  no_parameter_tuning_after_results: true
  no_hypothesis_rewrite_after_results: true
  statistical_significance_test: none

causality_policy:
  forming_bars_prohibited: true
  future_data_prohibited: true
  session_boundary_inference_prohibited: true
  missing_data_boundary_shift_prohibited: true
  current_date_outcome_in_regime_label_prohibited: true

interpretation_boundaries:
  descriptive_only: true
  trading_signal_prohibited: true
  profitability_claim_prohibited: true
  poc_value_area_prohibited: true
  ict_kill_zone_substitution_prohibited: true
  centralized_volume_claim_prohibited: true
  dealer_inventory_claim_prohibited: true

change_control:
  frozen_spec_is_immutable: true
  any_rule_change_requires_new_version: true

follow_up_design:
  follow_up_after_temporal_result: true
  base_study_id: xauusd_named_session_tpo_temporal_robustness_v1
  base_spec_path: quant/studies/XAUUSD_NAMED_SESSION_TPO_TEMPORAL_ROBUSTNESS_V1.yaml
  base_result_path: quant/results/XAUUSD_NAMED_SESSION_TPO_TEMPORAL_ROBUSTNESS_V1.result.yaml
  base_observed_direction_reference:
    range_ticks: new_york_gt_london
    occupancy_events: new_york_gt_london
  note: >-
    This regime study is frozen only after the aggregate and temporal results were observed.
    It is explicitly a follow-up robustness check, not a pre-result hypothesis for those studies.

regime_robustness:
  regime_id: lagged_paired_range_rank_v1
  regime_class: project_defined_causal_lagged_range_conditioning
  canonical_market_regime_claim: false
  pairing_key: session_instance_local_date
  pair_requirement: both_primary_sessions_complete
  composite_feature: range_ticks
  composite_formula: arithmetic_mean_of_london_and_new_york_range_ticks_on_each_prior_paired_date
  current_date_label_uses_only_prior_paired_dates: true
  lookback_paired_dates: 20
  warmup_minimum_paired_dates: 20
  rank_target: most_recent_prior_paired_date_composite
  rank_window: previous_20_paired_dates
  percentile_method: midrank_fraction_count_less_plus_half_equal_over_n
  thresholds:
    low_upper_exclusive: "1/3"
    normal_lower_inclusive: "1/3"
    normal_upper_exclusive: "2/3"
    high_lower_inclusive: "2/3"
  labels:
    - low
    - normal
    - high
  minimum_pair_n_per_regime: 10
  directional_features:
    - range_ticks
    - occupancy_events
  descriptive_context_features:
    - occupied_bins
    - mean_bin_occupancy
    - bars_seen
  eligible_regime_rule: both primary sessions meet minimum_pair_n_per_regime
  persistence_outputs:
    - eligible_regime_count
    - matching_direction_regime_count
    - matching_direction_fraction
  statistical_significance_test: none
  note: >-
    The label for date D is computed from the immediately preceding 20 paired dates only. The
    most recent prior paired-date composite is ranked within that prior-only window. No bar,
    session feature, or outcome from date D may affect its regime label.
