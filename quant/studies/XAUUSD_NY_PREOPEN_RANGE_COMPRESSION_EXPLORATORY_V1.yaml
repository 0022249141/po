reference_width:
  current_reference_width: reference_high - reference_low
  eligibility_rule: >-
    Complete positive pre-New-York reference range and complete New-York session under the bound frozen
    V1 strategy and frozen evaluation; no-trigger eligible dates remain in the reference-width history.
  source_history_includes_no_trigger_eligible_dates: true
  source_history_excludes_incomplete_or_non_positive_reference_dates: true

causal_features:
  lookback_eligible_reference_widths: 20
  lagged_baseline:
    statistic: median
    window: immediately_preceding_20_eligible_reference_widths
    current_date_in_baseline: false
    centered_window: false
    shift_direction: lagged_only
  primary_feature:
    name: relative_range_ratio
    formula: current_reference_width / lagged_20_reference_width_median
  causal_rank:
    target: current_reference_width
    comparator_window: immediately_preceding_20_eligible_reference_widths_only
    percentile_method: midrank_fraction_count_less_plus_half_equal_over_n
  frozen_descriptive_buckets:
    thresholds:
      compressed_upper_exclusive: "1/3"
      normal_lower_inclusive: "1/3"
      normal_upper_exclusive: "2/3"
      expanded_lower_inclusive: "2/3"
    labels:
      compressed: percentile < 1/3
      normal: 1/3 <= percentile < 2/3
      expanded: percentile >= 2/3

breakout_penetration:
  long: entry_price - reference_high
  short: reference_low - entry_price
  secondary_feature:
    name: penetration_ratio
    formula: breakout_penetration / current_reference_width

causality_policy:
  current_day_leakage_prohibited: true
  current_day_in_lagged_baseline_prohibited: true
  centered_windows_prohibited: true
  negative_shifts_prohibited: true
  future_data_prohibited: true
  current_reference_width_is_complete_before_new_york_breakout_trigger: true
  source_trade_outcomes_do_not_define_features: true

reporting:
  trade_filtering_permitted: false
  retain_all_source_trades_in_annotated_ledger: true
  warmup_without_20_prior_widths: retain_unassigned_in_ledger_and_overall_breakdowns
  metrics:
    - trades
    - net_R
    - expectancy_R
    - profit_factor
    - win_rate
    - stop_rate
    - average_R
    - median_R
  breakdowns:
    - overall
    - by_side
    - by_compression_bucket
    - side_x_compression_bucket
    - regime_x_side_x_compression_bucket
  minimum_cell_size: 10
  underpowered_label: underpowered_descriptive_only
  statistical_significance_test: none

interpretation_boundaries:
  descriptive_only: true
  statistical_significance_claim_prohibited: true
  profitability_claim_prohibited: true
  strategy_promotion_prohibited: true
  live_trading_permission: false
  automatic_filter_generation_prohibited: true
  same_sample_findings_cannot_validate_v2: true
  source_regime_definition_not_modified: true
  gross_R_is_not_net_profitability: true

change_control:
  frozen_spec_is_immutable: true
  any_change_requires_new_version: true
  no_lookback_tuning_after_results: true
  no_bucket_threshold_tuning_after_results: true
  no_strategy_parameter_tuning_after_results: true
  no_hypothesis_rewrite_after_results: true
