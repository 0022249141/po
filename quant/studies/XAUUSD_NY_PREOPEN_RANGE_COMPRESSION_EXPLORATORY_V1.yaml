research_question: >-
  On the already completed, bound V1 gross-signal backtest sample, is breakout outcome descriptively
  associated with a causal relative pre-New-York reference-range compression measure, with particular
  descriptive attention to the previously reported High-regime Short deterioration? This is a post-hoc
  diagnostic only and does not test, change, or promote the V1 strategy.

