[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-trading-research-core"
version = "0.2.0"
description = "Evidence-first trading knowledge, data validation, and quantitative research core."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2"
]

[tool.setuptools.packages.find]
include = ["research_core*"]

[project.scripts]
p-validate-csv = "research_core.cli:validate_csv_main"
p-audit-lookahead = "research_core.cli:audit_lookahead_main"
