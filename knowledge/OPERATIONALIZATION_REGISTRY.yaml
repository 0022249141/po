assessments:
  rtm_valid_swing:
    concept_state: defined
    readiness: blocked
    machine_ready: false
    target_role: structural_measure
    blockers:
      - objective retracement segmentation rule is not source-resolved
      - furthest-advance termination rule is not source-resolved
      - nested-swing and equal-extreme tie handling is not source-resolved
      - timeframe and closed-vs-forming-bar policy is not source-resolved
    candidate_spec_path: null

  dealer_informed_trading:
