name: research-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate source registry
        run: python tools/validate_registry.py
      - name: Validate framework ingestion
        run: python tools/validate_framework_ingestion.py
      - name: Validate concept registry
        run: python tools/validate_concepts.py
      - name: Validate operationalization registry
        run: python tools/validate_operationalization.py
      - name: Validate timebase registry
        run: python tools/validate_timebase.py
      - name: Validate named session policy
        run: python tools/validate_named_sessions.py
      - name: Validate descriptive study specifications
        run: python tools/validate_study_specs.py
      - name: Validate descriptive study results
        run: python tools/validate_study_results.py
      - name: Validate temporal robustness specifications
        run: python tools/validate_temporal_robustness.py
      - name: Validate temporal robustness results
        run: python tools/validate_temporal_results.py
      - name: Static lookahead audit
        run: python tools/audit_lookahead.py . --fail-on high
